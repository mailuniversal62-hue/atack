plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sync.core'
    compileSdk 34

    defaultConfig {
        applicationId "com.sync.core"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
